<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XIV 地牢</title>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>

      <div id="ui-overlay">
        <div id="hud">
          <section id="player-hud" class="hud-panel" aria-label="玩家战斗资源">
            <div class="panel-heading">
              <div>
                <div id="job-info" class="job-name">龙骑士</div>
                <div id="level-info" class="level-label">等级：1（0/10）</div>
              </div>
              <button
                id="attributes-toggle"
                class="panel-toggle"
                type="button"
                aria-controls="attribute-panel"
                aria-expanded="false"
                title="查看完整玩家属性"
              >
                属性
              </button>
            </div>
            <div class="resource-row">
              <div class="resource-label"><span>HP</span><strong id="hp-text">25/25</strong></div>
              <div id="hp-bar" class="resource-track" role="progressbar" aria-label="生命值" aria-valuemin="0" aria-valuemax="25" aria-valuenow="25">
                <div id="hp-fill" class="resource-fill"></div>
              </div>
            </div>
            <div class="resource-row">
              <div class="resource-label"><span>MP</span><strong id="mp-info">100/100</strong></div>
              <div id="mp-bar" class="resource-track" role="progressbar" aria-label="魔力值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                <div id="mp-fill" class="resource-fill"></div>
              </div>
            </div>
            <div class="resource-footer">
              <div id="resource-info" class="job-resource-list" aria-label="职业资源"></div>
              <span id="gil-info">Gil：0</span>
            </div>
          </section>

          <section id="run-hud" class="hud-panel" aria-label="地牢进度">
            <div class="run-heading">
              <strong id="floor-info">第 1 层</strong>
              <span id="turn-info">回合：0</span>
            </div>
            <div id="objective-info" class="objective-line">目标：找到出口</div>
            <div id="modifier-info" class="modifier-line hidden"></div>
          </section>

          <div id="hud-actions">
            <section id="skill-dock" class="hidden" aria-label="主动技能栏">
              <div class="skill-dock-heading">
                <strong>主动技能</strong>
                <span id="skill-slot-count">0/5</span>
                <button id="bag-btn" class="hud-btn hidden" type="button" title="打开背包">背包 <span>I</span></button>
              </div>
              <div id="skill-bar" aria-label="主动技能栏"></div>
            </section>
          </div>
        </div>

        <aside id="attribute-panel" class="attribute-panel closed" aria-hidden="true">
          <div class="panel-heading">
            <div>
              <h2>玩家属性</h2>
              <p>当前冒险实时数据</p>
            </div>
            <span class="panel-mark">STATUS</span>
          </div>
          <div id="attribute-info" class="attribute-grid"></div>
          <div id="derived-info" class="derived-grid"></div>
          <section class="passive-section" aria-labelledby="passive-heading">
            <h3 id="passive-heading">被动技能</h3>
            <div id="passive-info" class="passive-list"></div>
          </section>
        </aside>

        <div id="log-panel"></div>
      </div>

      <div id="title-screen" class="overlay-screen">
        <h1>XIV 地牢</h1>
        <p>5 层地牢与最终 Boss</p>
        <div id="title-actions" class="btn-row">
          <button id="continue-btn" class="hidden" type="button">继续游戏</button>
          <button id="new-game-btn" type="button">开始新游戏</button>
        </div>
        <p class="hint">点击空地寻路 · 点击路径 2 步内敌人攻击 · F 跳跃 · 方向键 / WASD 移动 · QEZC 斜向 · I 背包 · . 等待</p>
        <div id="job-selection" class="job-selection hidden">
          <h2>选择职业</h2>
          <div class="job-options">
            <button class="job-option selected" data-job="dragoon" type="button">
              <strong>龙骑士</strong>
              <span>以近战攻击为主的高机动职业</span>
            </button>
          </div>
          <div class="modifier-selection">
            <h3>修改器</h3>
            <label><input type="checkbox" data-modifier="infiniteHp" />无限血量</label>
            <label><input type="checkbox" data-modifier="autoCompleteObjectives" />每层直接完成任务目标</label>
            <label><input type="checkbox" data-modifier="oneHitKill" />一击必杀</label>
          </div>
          <button id="confirm-job-btn" type="button">开始探索</button>
        </div>
      </div>

      <div id="inventory-screen" class="overlay-screen hidden"></div>

      <div id="level-up-screen" class="overlay-screen hidden">
        <h1>等级提升！</h1>
        <p>选择一项升级奖励</p>
        <div id="level-up-options" class="level-up-options"></div>
      </div>

      <div id="victory-screen" class="overlay-screen hidden">
        <h1>胜利！</h1>
        <p>你击破了地牢底部的最终 Boss。</p>
        <button id="play-again-btn" type="button">再玩一次</button>
      </div>

      <div id="death-screen" class="overlay-screen hidden">
        <h1>你倒下了</h1>
        <div id="death-stats"></div>
        <button id="try-again-btn" type="button">再试一次</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
